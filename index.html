<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Cósmica de Tarot</title>
  <style>
    :root {
      --card-bg: rgba(23, 17, 39, 0.82);
      --item-bg: rgba(33, 25, 56, 0.72);
      --accent: #8a5cf5;
      --accent-hover: #7b4cf0;
      --gold: #facc15;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: rgba(167, 139, 250, 0.2);
      --border-focus: #c084fc;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --success: #34d399;
      --warning: #fbbf24;
      --magic: #c084fc;
      --magic-bg: rgba(192, 132, 252, 0.15);
      --no-magic-bg: rgba(148, 163, 184, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      background: radial-gradient(circle at 15% 20%, rgba(109, 40, 217, 0.45), transparent 45%),
                  radial-gradient(circle at 85% 80%, rgba(30, 58, 138, 0.45), transparent 50%),
                  radial-gradient(circle at 50% 50%, rgba(88, 28, 135, 0.35), transparent 60%),
                  #07050f;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fef08a, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 90px 40px, #ddd6fe, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #fef08a, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 230px 180px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 300px 90px, #c4b5fd, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 370px 240px, #fde047, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 450px 60px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 520px 290px, #f472b6, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 600px 150px, #ffffff, rgba(0,0,0,0));
      background-size: 650px 650px;
      opacity: 0.85;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.7; }
      100% { opacity: 0.95; }
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .title-stars {
      color: var(--gold);
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.75), 0 0 20px rgba(234, 179, 8, 0.4);
      animation: pulseStar 2s ease-in-out infinite alternate;
    }

    .title-text {
      background: linear-gradient(135deg, #fef08a 0%, #facc15 35%, #e9d5ff 75%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(234, 179, 8, 0.25));
    }

    @keyframes pulseStar {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.15); filter: brightness(1.3); }
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .form-row-primary {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.7fr 0.9fr 0.9fr;
      gap: 10px;
      align-items: end;
    }

    .form-row-magic {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    @media (max-width: 860px) {
      .form-row-primary {
        grid-template-columns: 1fr 1fr;
      }
      .form-row-magic {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .form-row-primary {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    select {
      width: 100%;
      min-width: 0;
      background: rgba(15, 10, 26, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
      color-scheme: dark;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    input[type="time"]:focus,
    select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 10px rgba(192, 132, 252, 0.3);
    }

    button.btn-add {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 0 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      height: 42px;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(138, 92, 245, 0.4);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button.btn-add:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(138, 92, 245, 0.55);
    }

    .sheet-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(30, 22, 50, 0.8);
      border: 1px dashed rgba(250, 204, 21, 0.35);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .sheet-select-all {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--gold);
      cursor: pointer;
      user-select: none;
      font-weight: 600;
    }

    .sheet-select-all input {
      accent-color: var(--gold);
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    .sheet-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-sheet {
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-sheet:hover:not(:disabled) {
      background: var(--gold);
      color: #000;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
    }

    .btn-sheet:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(250, 204, 21, 0.3);
    }

    .btn-history-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-history-toggle:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(167, 139, 250, 0.12);
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .sort-control select {
      padding: 6px 10px;
      font-size: 0.85rem;
      border-radius: 8px;
      width: auto;
    }

    .totals {
      display: flex;
      gap: 14px;
      font-size: 0.85rem;
      flex-wrap: wrap;
    }

    .totals span {
      color: var(--muted);
    }

    .totals strong {
      color: var(--gold);
    }

    .totals .magic-total {
      color: var(--magic);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      background: var(--item-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s, background 0.2s;
    }

    .item.selected {
      background: rgba(45, 33, 79, 0.85);
      border-color: rgba(250, 204, 21, 0.4);
    }

    .item.paid {
      border-left: 5px solid var(--success);
    }

    .item.pending {
      border-left: 5px solid var(--warning);
    }

    .select-box {
      accent-color: var(--gold);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .index-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.25);
      border-radius: 8px;
      padding: 4px 8px;
      min-width: 32px;
      text-align: center;
    }

    .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .info .name {
      font-weight: 600;
      font-size: 1.05rem;
      word-break: break-word;
    }

    .details-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .weekday-badge {
      background: rgba(167, 139, 250, 0.18);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: #e9d5ff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: capitalize;
    }

    .magic-badge {
      background: var(--magic-bg);
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: var(--magic);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .no-magic-badge {
      background: var(--no-magic-bg);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .info .time {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .price-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      background: rgba(250, 204, 21, 0.1);
      border: 1px solid rgba(250, 204, 21, 0.25);
      padding: 2px 8px;
      border-radius: 6px;
      color: #fde047;
      font-weight: 600;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pay-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      padding: 4px 10px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .pay-check.bubble-pending {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: var(--warning);
    }

    .pay-check.bubble-paid {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--success);
    }

    .pay-check input {
      accent-color: var(--success);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .magic-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      padding: 4px 6px;
    }

    .magic-check input {
      accent-color: var(--magic);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-icon {
      background: transparent;
      border: none;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: all 0.2s;
      line-height: 1;
    }

    .btn-edit {
      color: #93c5fd;
    }
    .btn-edit:hover {
      background: rgba(147, 197, 253, 0.18);
    }

    .btn-del {
      color: var(--danger);
      font-size: 1.35rem;
    }

    .btn-del:hover {
      background: rgba(248, 113, 113, 0.18);
      color: var(--danger-hover);
    }

    .empty-state {
      text-align: center;
      padding: 30px 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-box {
      background: #191328;
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 20px;
      width: 100%;
      max-width: 580px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(167, 139, 250, 0.2);
      padding-bottom: 10px;
    }

    .modal-header h3 {
      color: var(--gold);
      font-size: 1.25rem;
    }

    .modal-content {
      font-size: 0.92rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .summary-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(15, 10, 26, 0.6);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .summary-stats div {
      display: flex;
      flex-direction: column;
    }

    .summary-stats span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .summary-stats strong {
      font-size: 1.05rem;
      color: var(--gold);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid rgba(167, 139, 250, 0.2);
      padding-top: 14px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      cursor: pointer;
    }

    #history-container {
      margin-top: 24px;
      border-top: 1px dashed rgba(167, 139, 250, 0.3);
      padding-top: 20px;
    }

    .history-card {
      background: rgba(18, 12, 32, 0.85);
      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(167, 139, 250, 0.15);
    }

    .history-header h4 {
      color: var(--gold);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .history-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .history-list-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-client-row {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(167, 139, 250, 0.12);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    .history-client-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .history-client-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>
        <span class="title-stars">✨</span>
        <span class="title-text">Agenda Astral de Tarot</span>
        <span class="title-stars">✨</span>
      </h1>
      <p>Gerenciamento de consultas, parcerias de magia e folhas semanais</p>
    </header>

    <!-- Formulário Principal -->
    <div class="card">
      <form id="appointment-form">
        <div class="form-row-primary">
          <div class="input-group">
            <label for="client-name">Consulente</label>
            <input type="text" id="client-name" placeholder="Ex: Julia Santos" required>
          </div>

          <div class="input-group">
            <label for="client-date">Data</label>
            <input type="date" id="client-date" required>
          </div>

          <div class="input-group">
            <label for="client-time">Horário</label>
            <input type="time" id="client-time" value="00:00" required>
          </div>

          <div class="input-group">
            <label for="client-price-tarot">Valor Leitura (R$)</label>
            <input type="number" id="client-price-tarot" placeholder="Ex: 80" step="0.01" min="0">
          </div>

          <div class="input-group">
            <label for="client-price-magic">Valor Magia (R$)</label>
            <input type="number" id="client-price-magic" placeholder="Ex: 150" step="0.01" min="0">
          </div>
        </div>

        <div class="form-row-magic">
          <div class="input-group">
            <label for="client-magic-desc">🔮 Nome / Descrição da Magia (Opcional se houver magia)</label>
            <input type="text" id="client-magic-desc" placeholder="Ex: Adoçamento, Limpeza Espiritual, Abertura de Caminhos...">
          </div>

          <button type="submit" class="btn-add">Adicionar Horário</button>
        </div>
      </form>
    </div>

    <!-- Lista de Consultas -->
    <div class="card">
      <div class="sheet-bar">
        <label class="sheet-select-all">
          <input type="checkbox" id="select-all-box" onchange="toggleSelectAll(this.checked)">
          <span>Selecionar Todos</span>
        </label>

        <div class="sheet-actions">
          <button class="btn-sheet" id="btn-close-sheet" onclick="openCloseSheetModal()" disabled>
            📜 Fechar Folha (<span id="selected-count">0</span>)
          </button>
          <button class="btn-history-toggle" onclick="toggleHistoryView()">
            📁 Ver Histórico de Folhas (<span id="history-badge-count">0</span>)
          </button>
        </div>
      </div>

      <div class="toolbar">
        <div class="sort-control">
          <label for="sort-order">Ordenar por:</label>
          <select id="sort-order" onchange="renderList()">
            <option value="time">Horário / Data</option>
            <option value="name">Ordem Alfabética (A-Z)</option>
            <option value="recent">Mais Recentes Adicionados</option>
          </select>
        </div>

        <div class="totals">
          <span id="counter">0 consultas ativas</span>
          <span>Pago na Agenda: <strong id="total-revenue">R$ 0,00</strong></span>
          <span>Magias: <strong class="magic-total" id="magic-total">0</strong></span>
        </div>
      </div>

      <ul id="schedule-list"></ul>
      <div id="empty-state" class="empty-state">Nenhum horário marcado nas estrelas ainda. 🌙</div>

      <!-- Histórico de Folhas Fechadas -->
      <div id="history-container" style="display: none;">
        <h3 style="color: var(--gold); font-size: 1.15rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;">
          📁 Histórico de Folhas Fechadas
        </h3>
        <div id="history-list"></div>
      </div>
    </div>
  </div>

  <!-- Modal de Fechamento de Folha -->
  <div class="modal-overlay" id="sheet-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>✨ Fechar Folha Semanal</h3>
        <button class="btn-del" onclick="closeSheetModal()">&times;</button>
      </div>
      <div class="modal-content" id="modal-content-area"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="copySheetSummary()">Copiar Texto (Zap)</button>
        <button class="btn-primary" onclick="confirmArchiveSheet()">Arquivar e Limpar Selecionados</button>
      </div>
    </div>
  </div>

  <!-- Modal de Edição de Consulente -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>✏️ Editar Consulta</h3>
        <button class="btn-del" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="edit-form" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <input type="hidden" id="edit-target-type">
        <input type="hidden" id="edit-sheet-id">
        <input type="hidden" id="edit-item-id">

        <div class="input-group">
          <label for="edit-name">Nome do(a) Consulente</label>
          <input type="text" id="edit-name" required>
        </div>
        <div class="input-group">
          <label for="edit-date">Data</label>
          <input type="date" id="edit-date" required>
        </div>
        <div class="input-group">
          <label for="edit-time">Horário</label>
          <input type="time" id="edit-time" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="input-group">
            <label for="edit-price-tarot">Valor da Leitura (R$)</label>
            <input type="number" id="edit-price-tarot" step="0.01" min="0">
          </div>
          <div class="input-group">
            <label for="edit-price-magic">Valor da Magia (R$)</label>
            <input type="number" id="edit-price-magic" step="0.01" min="0">
          </div>
        </div>

        <div class="input-group">
          <label for="edit-magic-desc">🔮 Nome / Descrição da Magia</label>
          <input type="text" id="edit-magic-desc" placeholder="Ex: Limpeza Espiritual...">
        </div>

        <div style="display: flex; gap: 14px; margin-top: 4px; align-items: center;">
          <label class="pay-check bubble-pending" id="edit-paid-label">
            <input type="checkbox" id="edit-paid" onchange="updateEditLabel(this.checked)">
            <span id="edit-paid-text">Não Pago</span>
          </label>
          <label class="magic-check">
            <input type="checkbox" id="edit-magic">
            <span>🔮 Houve Magia Fechada</span>
          </label>
        </div>

        <div class="modal-actions" style="margin-top: 10px;">
          <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('appointment-form');
    const nameInput = document.getElementById('client-name');
    const dateInput = document.getElementById('client-date');
    const timeInput = document.getElementById('client-time');
    const priceTarotInput = document.getElementById('client-price-tarot');
    const priceMagicInput = document.getElementById('client-price-magic');
    const magicDescInput = document.getElementById('client-magic-desc');
    const sortOrder = document.getElementById('sort-order');
    const scheduleList = document.getElementById('schedule-list');
    const emptyState = document.getElementById('empty-state');
    const counter = document.getElementById('counter');
    const totalRevenueEl = document.getElementById('total-revenue');
    const magicTotalEl = document.getElementById('magic-total');

    const selectAllBox = document.getElementById('select-all-box');
    const btnCloseSheet = document.getElementById('btn-close-sheet');
    const selectedCountSpan = document.getElementById('selected-count');
    const historyBadgeCount = document.getElementById('history-badge-count');
    const sheetModal = document.getElementById('sheet-modal');
    const modalContentArea = document.getElementById('modal-content-area');
    const historyContainer = document.getElementById('history-container');
    const historyList = document.getElementById('history-list');

    // Modal Edit
    const editModal = document.getElementById('edit-modal');
    const editForm = document.getElementById('edit-form');
    const editTargetType = document.getElementById('edit-target-type');
    const editSheetId = document.getElementById('edit-sheet-id');
    const editItemId = document.getElementById('edit-item-id');
    const editName = document.getElementById('edit-name');
    const editDate = document.getElementById('edit-date');
    const editTime = document.getElementById('edit-time');
    const editPriceTarot = document.getElementById('edit-price-tarot');
    const editPriceMagic = document.getElementById('edit-price-magic');
    const editMagicDesc = document.getElementById('edit-magic-desc');
    const editPaid = document.getElementById('edit-paid');
    const editMagic = document.getElementById('edit-magic');
    const editPaidLabel = document.getElementById('edit-paid-label');
    const editPaidText = document.getElementById('edit-paid-text');

    let appointments = JSON.parse(localStorage.getItem('tarot_appointments_v8')) || [];
    let closedSheets = JSON.parse(localStorage.getItem('tarot_closed_sheets_v8')) || [];
    let selectedIds = new Set();
    let currentClosingSummaryText = "";

    function saveToStorage() {
      localStorage.setItem('tarot_appointments_v8', JSON.stringify(appointments));
      localStorage.setItem('tarot_closed_sheets_v8', JSON.stringify(closedSheets));
      historyBadgeCount.textContent = closedSheets.length;
    }

    function formatSchedule(dateStr, timeStr) {
      if (!dateStr) return { formattedDate: '', weekday: '' };
      const [year, month, day] = dateStr.split('-');
      const shortYear = year ? year.slice(-2) : '';
      const dateObj = new Date(Number(year), Number(month) - 1, Number(day));
      const weekday = dateObj.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');

      return {
        formattedDate: `${day}/${month}/${shortYear} às ${timeStr}`,
        weekday: weekday.charAt(0).toUpperCase() + weekday.slice(1)
      };
    }

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function getItemTotal(item) {
      const tarot = Number(item.priceTarot || item.price || 0);
      const magic = Number(item.priceMagic || 0);
      return tarot + magic;
    }

    function renderPriceLabel(item) {
      const tarot = Number(item.priceTarot || item.price || 0);
      const magic = Number(item.priceMagic || 0);

      if (magic > 0) {
        return `<span class="price-box">Leitura: ${formatCurrency(tarot)} | Magia: ${formatCurrency(magic)} (Total: ${formatCurrency(tarot + magic)})</span>`;
      }
      return `<span class="price-box">Leitura: ${formatCurrency(tarot)}</span>`;
    }

    function sortAppointments(items, criterion) {
      const copy = [...items];
      if (criterion === 'name') return copy.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
      if (criterion === 'recent') return copy.sort((a, b) => b.id - a.id);
      return copy.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
    }

    function updateSelectionState() {
      selectedCountSpan.textContent = selectedIds.size;
      btnCloseSheet.disabled = selectedIds.size === 0;
      selectAllBox.checked = appointments.length > 0 && selectedIds.size === appointments.length;
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateSelectionState();
      renderList(false);
    }

    function toggleSelectAll(isChecked) {
      if (isChecked) {
        appointments.forEach(a => selectedIds.add(a.id));
      } else {
        selectedIds.clear();
      }
      updateSelectionState();
      renderList(false);
    }

    function renderList(resetSelection = true) {
      scheduleList.innerHTML = '';
      if (resetSelection) {
        selectedIds.clear();
        updateSelectionState();
      }

      const sortedList = sortAppointments(appointments, sortOrder.value);

      const totalPaid = appointments
        .filter(item => item.paid)
        .reduce((acc, curr) => acc + getItemTotal(curr), 0);
      
      const totalMagic = appointments.filter(item => item.magic).length;

      totalRevenueEl.textContent = formatCurrency(totalPaid);
      magicTotalEl.textContent = `${totalMagic} ${totalMagic === 1 ? 'magia' : 'magias'}`;
      counter.textContent = `${appointments.length} ${appointments.length === 1 ? 'consulta ativa' : 'consultas ativas'}`;
      historyBadgeCount.textContent = closedSheets.length;

      if (sortedList.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      sortedList.forEach((item, idx) => {
        const { formattedDate, weekday } = formatSchedule(item.date, item.time);
        const itemNumber = idx + 1;
        const isSelected = selectedIds.has(item.id);

        const li = document.createElement('li');
        li.className = `item ${item.paid ? 'paid' : 'pending'} ${isSelected ? 'selected' : ''}`;

        const magicTitle = item.magicDesc ? `🔮 Magia: ${item.magicDesc}` : `🔮 Magia Fechada`;

        li.innerHTML = `
          <input type="checkbox" class="select-box" title="Marcar para fechar folha" 
            ${isSelected ? 'checked' : ''} onchange="toggleSelect(${item.id})">
          <div class="index-badge">#${itemNumber}</div>
          <div class="info">
            <span class="name">${item.name}</span>
            <div class="details-row">
              <span class="weekday-badge">${weekday}</span>
              <span class="time">${formattedDate}</span>
              ${renderPriceLabel(item)}
              ${item.magic ? `<span class="magic-badge">${magicTitle}</span>` : `<span class="no-magic-badge">⚪ Sem Magia</span>`}
            </div>
          </div>
          <div class="actions">
            <label class="pay-check ${item.paid ? 'bubble-paid' : 'bubble-pending'}">
              <input type="checkbox" ${item.paid ? 'checked' : ''} onchange="togglePaid(${item.id})">
              <span>${item.paid ? 'Pago' : 'Não Pago'}</span>
            </label>
            <label class="magic-check" title="Marcar se houve magia com a parceira">
              <input type="checkbox" ${item.magic ? 'checked' : ''} onchange="toggleMagic(${item.id})">
              <span>🔮 Magia</span>
            </label>
            <button class="btn-icon btn-edit" title="Editar" onclick="openEditModal('active', null, ${item.id})">✏️</button>
            <button class="btn-icon btn-del" title="Excluir" onclick="deleteActiveItem(${item.id})">&times;</button>
          </div>
        `;

        scheduleList.appendChild(li);
      });
    }

    function togglePaid(id) {
      appointments = appointments.map(item => item.id === id ? { ...item, paid: !item.paid } : item);
      saveToStorage();
      renderList(false);
    }

    function toggleMagic(id) {
      appointments = appointments.map(item => item.id === id ? { ...item, magic: !item.magic } : item);
      saveToStorage();
      renderList(false);
    }

    function deleteActiveItem(id) {
      if (confirm("Deseja realmente remover esta consulta da agenda?")) {
        appointments = appointments.filter(item => item.id !== id);
        selectedIds.delete(id);
        saveToStorage();
        renderList(false);
        updateSelectionState();
      }
    }

    /* Modal de Fechamento de Folha */
    function openCloseSheetModal() {
      const selectedItems = appointments.filter(a => selectedIds.has(a.id));
      const totalPaid = selectedItems.filter(i => i.paid).reduce((acc, curr) => acc + getItemTotal(curr), 0);
      const totalTarot = selectedItems.filter(i => i.paid).reduce((acc, curr) => acc + Number(curr.priceTarot || curr.price || 0), 0);
      const totalMagicPrice = selectedItems.filter(i => i.paid).reduce((acc, curr) => acc + Number(curr.priceMagic || 0), 0);
      const totalPending = selectedItems.filter(i => !i.paid).reduce((acc, curr) => acc + getItemTotal(curr), 0);
      const magicsClosed = selectedItems.filter(i => i.magic).length;

      let textSummary = `✨ FECHAMENTO DE TAROT ✨\n`;
      textSummary += `📅 Data: ${new Date().toLocaleDateString('pt-BR')}\n`;
      textSummary += `🔮 Total de Consultas: ${selectedItems.length}\n`;
      textSummary += `💰 Total Recebido Geral: ${formatCurrency(totalPaid)}\n`;
      textSummary += `🎴 Total Leitura Tarot: ${formatCurrency(totalTarot)}\n`;
      textSummary += `🕯️ Total Magias Parceria: ${formatCurrency(totalMagicPrice)} (${magicsClosed} fechadas)\n`;
      if (totalPending > 0) textSummary += `⚠️ Total Não Pago: ${formatCurrency(totalPending)}\n`;
      textSummary += `\nConsulentes:\n`;

      let htmlClients = `<ul style="list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">`;
      selectedItems.forEach(item => {
        const status = item.paid ? '✅ Pago' : '⏳ Não Pago';
        const magicName = item.magicDesc ? ` (${item.magicDesc})` : '';
        const magicTag = item.magic ? `🔮 Magia Fechada${magicName}` : '⚪ Sem Magia';
        const tarotVal = Number(item.priceTarot || item.price || 0);
        const magicVal = Number(item.priceMagic || 0);

        let priceTxt = `Leitura: ${formatCurrency(tarotVal)}`;
        if (magicVal > 0) priceTxt += ` + Magia: ${formatCurrency(magicVal)} = Total: ${formatCurrency(tarotVal + magicVal)}`;

        htmlClients += `<li style="background: rgba(255,255,255,0.04); padding: 6px 10px; border-radius: 8px; font-size: 0.88rem; display: flex; justify-content: space-between; align-items: center;">
          <span><strong>${item.name}</strong> (${priceTxt}) <small style="color: ${item.magic ? 'var(--magic)' : 'var(--muted)'};">[${magicTag}]</small></span>
          <span>${status}</span>
        </li>`;
        textSummary += `- ${item.name}: ${priceTxt} | ${magicTag} (${status})\n`;
      });
      htmlClients += `</ul>`;

      currentClosingSummaryText = textSummary;

      modalContentArea.innerHTML = `
        <div class="summary-stats">
          <div>
            <span>Total Geral</span>
            <strong>${formatCurrency(totalPaid)}</strong>
          </div>
          <div>
            <span>Total Tarot</span>
            <strong>${formatCurrency(totalTarot)}</strong>
          </div>
          <div>
            <span>Total Magia</span>
            <strong style="color: var(--magic);">${formatCurrency(totalMagicPrice)}</strong>
          </div>
        </div>
        ${totalPending > 0 ? `<p style="color: var(--warning); font-size: 0.85rem;">⚠️ Atenção: ${formatCurrency(totalPending)} ainda constam como Não Pagos.</p>` : ''}
        <div>
          <label style="font-weight: 600; color: var(--muted); font-size: 0.85rem;">Consulentes inclusos nesta folha:</label>
          ${htmlClients}
        </div>
      `;

      sheetModal.style.display = 'flex';
    }

    function closeSheetModal() {
      sheetModal.style.display = 'none';
    }

    function copySheetSummary() {
      navigator.clipboard.writeText(currentClosingSummaryText).then(() => {
        alert("Resumo copiado com sucesso! Pode colar no WhatsApp.");
      });
    }

    function confirmArchiveSheet() {
      const selectedItems = appointments.filter(a => selectedIds.has(a.id));
      const totalPaid = selectedItems.filter(i => i.paid).reduce((acc, curr) => acc + getItemTotal(curr), 0);
      const totalTarot = selectedItems.filter(i => i.paid).reduce((acc, curr) => acc + Number(curr.priceTarot || curr.price || 0), 0);
      const totalMagicPrice = selectedItems.filter(i => i.paid).reduce((acc, curr) => acc + Number(curr.priceMagic || 0), 0);
      const totalMagics = selectedItems.filter(i => i.magic).length;

      const archivedSheet = {
        id: Date.now(),
        date: new Date().toLocaleDateString('pt-BR'),
        items: selectedItems,
        totalPaid: totalPaid,
        totalTarot: totalTarot,
        totalMagicPrice: totalMagicPrice,
        totalCount: selectedItems.length,
        totalMagics: totalMagics
      };

      closedSheets.unshift(archivedSheet);
      appointments = appointments.filter(a => !selectedIds.has(a.id));
      selectedIds.clear();

      saveToStorage();
      closeSheetModal();
      renderList();
      renderHistory();
    }

    /* Histórico */
    function toggleHistoryView() {
      const isVisible = historyContainer.style.display === 'block';
      historyContainer.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (closedSheets.length === 0) {
        historyList.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem; text-align: center; padding: 16px 0;">Nenhuma folha arquivada no momento.</p>';
        return;
      }

      closedSheets.forEach(sheet => {
        const div = document.createElement('div');
        div.className = 'history-card';

        let itemsListHtml = '';
        sheet.items.forEach(item => {
          const { formattedDate, weekday } = formatSchedule(item.date, item.time);
          const tarotVal = Number(item.priceTarot || item.price || 0);
          const magicVal = Number(item.priceMagic || 0);
          const sumTotal = tarotVal + magicVal;

          let priceDetail = `Leitura: ${formatCurrency(tarotVal)}`;
          if (magicVal > 0) {
            priceDetail += ` | Magia: ${formatCurrency(magicVal)} (Soma: ${formatCurrency(sumTotal)})`;
          }

          const magicTag = item.magic ? (item.magicDesc ? `🔮 ${item.magicDesc}` : `🔮 Magia Fechada`) : `⚪ Sem Magia`;

          itemsListHtml += `
            <div class="history-client-row">
              <div class="history-client-info">
                <strong>${item.name}</strong>
                <span class="weekday-badge">${weekday}</span>
                <span style="color: var(--muted); font-size: 0.8rem;">${formattedDate}</span>
                <span class="price-box">${priceDetail}</span>
                <span style="font-size: 0.75rem; color: ${item.paid ? 'var(--success)' : 'var(--warning)'}; font-weight: 600;">
                  ${item.paid ? '● Pago' : '○ Não Pago'}
                </span>
                <span class="${item.magic ? 'magic-badge' : 'no-magic-badge'}">${magicTag}</span>
              </div>
              <div class="history-client-actions">
                <button class="btn-icon btn-edit" title="Editar consulente da folha" 
                  onclick="openEditModal('history', ${sheet.id}, ${item.id})">✏️</button>
                <button class="btn-icon btn-del" title="Remover da folha" 
                  onclick="deleteHistoryItem(${sheet.id}, ${item.id})">&times;</button>
              </div>
            </div>
          `;
        });

        div.innerHTML = `
          <div class="history-header">
            <div>
              <h4>Folha Fechada em ${sheet.date}</h4>
              <span style="font-size: 0.82rem; color: var(--muted);">
                ${sheet.items.length} ${sheet.items.length === 1 ? 'atendimento' : 'atendimentos'} • 
                <span style="color: var(--magic); font-weight: 600;">${sheet.totalMagics || 0} magias</span>
              </span>
            </div>
            <div class="history-header-actions">
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                <strong style="color: var(--success); font-size: 1.05rem;">Total Geral: ${formatCurrency(sheet.totalPaid)}</strong>
                <span style="font-size: 0.75rem; color: var(--muted);">
                  Leitura: ${formatCurrency(sheet.totalTarot || sheet.totalPaid)} | Magias: ${formatCurrency(sheet.totalMagicPrice || 0)}
                </span>
              </div>
              <button class="btn-icon btn-del" title="Excluir folha inteira" 
                onclick="deleteEntireSheet(${sheet.id})">🗑️</button>
            </div>
          </div>
          <div class="history-list-items">
            ${itemsListHtml}
          </div>
        `;
        historyList.appendChild(div);
      });
    }

    function deleteEntireSheet(sheetId) {
      if (!confirm("Tem certeza que deseja apagar esta folha inteira?")) return;
      const restore = confirm("Deseja restaurar as consultas desta folha de volta para a agenda ativa?\n\n[OK] = Restaurar para a agenda\n[Cancelar] = Deletar tudo definitivamente");
      
      const sheet = closedSheets.find(s => s.id === sheetId);
      if (restore && sheet) {
        appointments.push(...sheet.items);
      }
      
      closedSheets = closedSheets.filter(s => s.id !== sheetId);
      saveToStorage();
      renderList();
      renderHistory();
    }

    function deleteHistoryItem(sheetId, itemId) {
      if (!confirm("Remover este consulente desta folha fechada?")) return;

      closedSheets = closedSheets.map(sheet => {
        if (sheet.id === sheetId) {
          const newItems = sheet.items.filter(i => i.id !== itemId);
          const newTotal = newItems.filter(i => i.paid).reduce((acc, curr) => acc + getItemTotal(curr), 0);
          const newTarot = newItems.filter(i => i.paid).reduce((acc, curr) => acc + Number(curr.priceTarot || curr.price || 0), 0);
          const newMagicPrice = newItems.filter(i => i.paid).reduce((acc, curr) => acc + Number(curr.priceMagic || 0), 0);
          const newMagics = newItems.filter(i => i.magic).length;
          return {
            ...sheet,
            items: newItems,
            totalPaid: newTotal,
            totalTarot: newTarot,
            totalMagicPrice: newMagicPrice,
            totalCount: newItems.length,
            totalMagics: newMagics
          };
        }
        return sheet;
      }).filter(sheet => sheet.items.length > 0);

      saveToStorage();
      renderHistory();
    }

    /* Modal de Edição */
    function updateEditLabel(isPaid) {
      if (isPaid) {
        editPaidLabel.className = 'pay-check bubble-paid';
        editPaidText.textContent = 'Pago';
      } else {
        editPaidLabel.className = 'pay-check bubble-pending';
        editPaidText.textContent = 'Não Pago';
      }
    }

    function openEditModal(targetType, sheetId, itemId) {
      editTargetType.value = targetType;
      editSheetId.value = sheetId || '';
      editItemId.value = itemId;

      let itemToEdit = null;

      if (targetType === 'active') {
        itemToEdit = appointments.find(i => i.id === itemId);
      } else {
        const sheet = closedSheets.find(s => s.id === sheetId);
        if (sheet) itemToEdit = sheet.items.find(i => i.id === itemId);
      }

      if (!itemToEdit) return;

      editName.value = itemToEdit.name;
      editDate.value = itemToEdit.date;
      editTime.value = itemToEdit.time;
      editPriceTarot.value = itemToEdit.priceTarot !== undefined ? itemToEdit.priceTarot : (itemToEdit.price || '');
      editPriceMagic.value = itemToEdit.priceMagic || '';
      editMagicDesc.value = itemToEdit.magicDesc || '';
      editPaid.checked = !!itemToEdit.paid;
      editMagic.checked = !!itemToEdit.magic;
      updateEditLabel(editPaid.checked);

      editModal.style.display = 'flex';
      editName.focus();
    }

    function closeEditModal() {
      editModal.style.display = 'none';
      editForm.reset();
    }

    editForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const targetType = editTargetType.value;
      const sheetId = Number(editSheetId.value);
      const itemId = Number(editItemId.value);

      const updatedData = {
        name: editName.value.trim(),
        date: editDate.value,
        time: editTime.value,
        priceTarot: parseFloat(editPriceTarot.value) || 0,
        priceMagic: parseFloat(editPriceMagic.value) || 0,
        magicDesc: editMagicDesc.value.trim(),
        paid: editPaid.checked,
        magic: editMagic.checked || !!editMagicDesc.value.trim() || (parseFloat(editPriceMagic.value) > 0)
      };

      if (targetType === 'active') {
        appointments = appointments.map(item => {
          if (item.id === itemId) {
            return { ...item, ...updatedData };
          }
          return item;
        });
        renderList(false);
      } else {
        closedSheets = closedSheets.map(sheet => {
          if (sheet.id === sheetId) {
            const updatedItems = sheet.items.map(item => {
              if (item.id === itemId) {
                return { ...item, ...updatedData };
              }
              return item;
            });
            const newTotal = updatedItems.filter(i => i.paid).reduce((acc, curr) => acc + getItemTotal(curr), 0);
            const newTarot = updatedItems.filter(i => i.paid).reduce((acc, curr) => acc + Number(curr.priceTarot || curr.price || 0), 0);
            const newMagicPrice = updatedItems.filter(i => i.paid).reduce((acc, curr) => acc + Number(curr.priceMagic || 0), 0);
            const newMagics = updatedItems.filter(i => i.magic).length;
            return {
              ...sheet,
              items: updatedItems,
              totalPaid: newTotal,
              totalTarot: newTarot,
              totalMagicPrice: newMagicPrice,
              totalMagics: newMagics
            };
          }
          return sheet;
        });
        renderHistory();
      }

      saveToStorage();
      closeEditModal();
    });

    /* Cadastro Inicial */
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const hasMagicInput = !!magicDescInput.value.trim() || (parseFloat(priceMagicInput.value) > 0);

      const newAppointment = {
        id: Date.now(),
        name: nameInput.value.trim(),
        date: dateInput.value,
        time: timeInput.value || "00:00",
        priceTarot: parseFloat(priceTarotInput.value) || 0,
        priceMagic: parseFloat(priceMagicInput.value) || 0,
        magicDesc: magicDescInput.value.trim(),
        paid: false,
        magic: hasMagicInput
      };

      appointments.push(newAppointment);
      saveToStorage();
      renderList(false);

      nameInput.value = '';
      dateInput.value = '';
      timeInput.value = '00:00';
      priceTarotInput.value = '';
      priceMagicInput.value = '';
      magicDescInput.value = '';
      nameInput.focus();
    });

    renderList();
    renderHistory();
  </script>
</body>
</html>
